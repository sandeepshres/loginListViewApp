<ion-header>
  <ion-toolbar color="primary">
    <ion-grid>
      <ion-row>
        <ion-col size="2">
          <ion-back-button defaultHref="/home"></ion-back-button>
        </ion-col>
        <ion-col size="10">
          <ion-title>List View</ion-title>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div>
    <ion-list>
      <ion-item-sliding *ngFor="let item of items">
        <ion-item>
          <div class="icon">
            <img src="/assets/icon/diamond.png" />
          </div>
          <h4>{{ item.name }}</h4>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="danger" (click)="deleteItem(item.id)">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ion-list>
  </div>
</ion-content>
